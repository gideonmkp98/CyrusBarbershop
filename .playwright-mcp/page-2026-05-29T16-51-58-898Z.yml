        - paragraph [ref=e23]: De naam Cyrus is geïnspireerd op Cyrus de Grote, een van de meest gerespecteerde leiders uit de geschiedenis. Hij stond bekend om zijn wijsheid, visie, rechtvaardigheid en respect.
        - paragraph [ref=e25]: Bij Cyrus Barbershop vormen deze principes de basis van alles wat we doen. Wij geloven dat een bezoek aan de barbershop meer is dan alleen een knip- of scheerbeurt. Het is een moment van aandacht, vakmanschap en persoonlijke verzorging.
        - paragraph [ref=e26]: Onze barbers combineren traditionele technieken met moderne stijl, waarbij kwaliteit, gastvrijheid en respect voor iedere klant centraal staan.
